<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonials — European Era</title>
    <meta name="description" content="Student and partner testimonials for European Era mobility and internship programs." />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <script type="module" src="../js/main.js"></script>
  </head>
  <body style="display: flex; flex-direction: column; min-height: 100vh">
    <a class="sr-only" href="#main">Skip to content</a>
    <div id="site-navbar"></div>

    <main id="main" style="flex: 1">
      <header class="page-hero">
        <div class="container page-intro" data-animate>
          <h1>Testimonials</h1>
          <p class="lead">Real feedback from students and partners — focused on clarity, trust, and outcomes.</p>
          <div class="hero__actions" style="margin-top: 1.25rem">
            <a class="btn btn--primary" href="apply.html">Apply now</a>
            <a class="btn btn--secondary" href="opportunities.html">Explore opportunities</a>
          </div>
        </div>
      </header>

      <section class="section">
        <div class="container">
          <h2 class="mb-lg" id="student-stories">Student stories</h2>
          <div class="card-grid card-grid--2">
            <figure class="card testimonial" data-animate>
              <blockquote>“I didn’t feel lost in paperwork — the checklist and timeline saved me weeks.”</blockquote>
              <figcaption><span class="name">Ana L.</span><br /><span class="role">Remote internship</span></figcaption>
            </figure>
            <figure class="card testimonial" data-animate>
              <blockquote>“Interview prep was practical. I walked in knowing exactly what to highlight.”</blockquote>
              <figcaption><span class="name">Marcus T.</span><br /><span class="role">Tech internship — Barcelona</span></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="section section--surface">
        <div class="container">
          <h2 class="mb-lg" id="success-stories">Success stories</h2>
          <div class="card-grid card-grid--2">
            <figure class="card testimonial" data-animate>
              <blockquote>“From application to signed agreement in four weeks — the process was transparent.”</blockquote>
              <figcaption><span class="name">Elena R.</span><br /><span class="role">Erasmus — Porto</span></figcaption>
            </figure>
            <figure class="card testimonial" data-animate>
              <blockquote>“I landed a return offer after a structured internship with weekly feedback loops.”</blockquote>
              <figcaption><span class="name">Jonas P.</span><br /><span class="role">Business internship — Munich</span></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <h2 class="mb-lg" id="partner-feedback">Partner feedback</h2>
          <div class="card-grid card-grid--2">
            <figure class="card testimonial" data-animate>
              <blockquote>“Candidates arrive prepared. The process is structured without being rigid.”</blockquote>
              <figcaption><span class="name">HR Coordinator</span><br /><span class="role">Company partner — EU</span></figcaption>
            </figure>
            <figure class="card testimonial" data-animate>
              <blockquote>“Communication is proactive — we always know what’s happening next.”</blockquote>
              <figcaption><span class="name">Mobility office</span><br /><span class="role">University partner</span></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="cta-band" data-animate>
            <div class="cta-band__row">
              <div>
                <h2 class="mb-sm">Your story next</h2>
                <p class="lead mb-0">Join a network built for modern European mobility.</p>
              </div>
              <a class="btn btn--primary btn--lg" href="contact.html">Contact us</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
  </body>
</html>
